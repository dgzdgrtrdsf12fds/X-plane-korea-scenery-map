<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Plane Korea Scenery Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* 상단 컨트롤 패널 */
    .control-panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: flex; gap: 10px; align-items: center;
    }
    .admin-btn {
      background: #007bff; color: white; border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .filter-group label { margin-right: 8px; font-size: 14px; cursor: pointer; }

    .modal {
      display: none; position: fixed; z-index: 2000; left: 0; top: 0;
      width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 8px; width: 300px; text-align: center;
    }
    .modal-content input { width: 80%; padding: 8px; margin: 10px 0; }
    .modal-content button { padding: 8px 16px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 컨트롤 패널 (유료/무료 토글 & 관리자 로그인) -->
  <div class="control-panel">
    <div class="filter-group">
      <label><input type="checkbox" id="showFree" checked onchange="filterSceneries()"> 무료 보기</label>
      <label><input type="checkbox" id="showPayware" checked onchange="filterSceneries()"> 유료 보기</label>
    </div>
    <button class="admin-btn" id="adminToggleBtn" onclick="openLoginModal()">관리자 로그인</button>
  </div>

  <div id="map"></div>

  <!-- 비밀번호 입력 모달 -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3>관리자 로그인</h3>
      <input type="password" id="adminPassword" placeholder="비밀번호 입력">
      <div>
        <button onclick="checkPassword()">확인</button>
        <button onclick="closeLoginModal()">취소</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // 1. Firebase 설정 (본인의 Firebase 키로 변경)
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const sceneryRef = database.ref('sceneries');

    // 2. 지도 초기화 (구글 하이브리드)
    const map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      attribution: '&copy; Google Maps'
    }).addTo(map);

    let isAdmin = false;
    let rawSceneryData = {}; // 원본 데이터 저장용
    let drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    let drawControl = new L.Control.Draw({
      draw: {
        polyline: false, polygon: false, circle: false, circlemarker: false,
        marker: true, rectangle: true
      },
      edit: { featureGroup: drawnItems, remove: true }
    });

    // 3. 관리자 로그인 (비밀번호: tlqkf123)
    function openLoginModal() {
      if(isAdmin) {
        isAdmin = false;
        map.removeControl(drawControl);
        document.getElementById('adminToggleBtn').innerText = '관리자 로그인';
        alert('로그아웃 되었습니다.');
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('adminPassword').value = '';
    }

    function checkPassword() {
      const input = document.getElementById('adminPassword').value;
      if(input === 'tlqkf123') {
        isAdmin = true;
        map.addControl(drawControl);
        document.getElementById('adminToggleBtn').innerText = '관리자 (로그아웃)';
        closeLoginModal();
        alert('관리자로 로그인되었습니다.');
      } else {
        alert('비밀번호가 틀렸습니다.');
      }
    }

    // 4. DB 저장 및 삭제
    map.on(L.Draw.Event.CREATED, function (e) {
      if(!isAdmin) return;
      const layer = e.layer;
      const type = e.layerType;
      
      const title = prompt("시너리 이름을 입력하세요:", "새 시너리");
      if(!title) return;

      const isPayware = confirm("유료(Payware) 시너리인가요?\n[확인] = 유료, [취소] = 무료");
      const paywareStatus = isPayware ? "payware" : "free";

      let geoJsonData = layer.toGeoJSON();
      geoJsonData.properties = { 
        title: title, 
        type: type,
        payware: paywareStatus
      };

      const newRef = sceneryRef.push();
      newRef.set(geoJsonData);
    });

    map.on(L.Draw.Event.DELETED, function (e) {
      if(!isAdmin) return;
      e.layers.eachLayer(function (layer) {
        if(layer.firebaseId) {
          sceneryRef.child(layer.firebaseId).remove();
        }
      });
    });

    // 5. 실시간 DB 수신 및 필터링
    sceneryRef.on('value', function(snapshot) {
      rawSceneryData = snapshot.val() || {};
      filterSceneries();
    });

    function filterSceneries() {
      drawnItems.clearLayers();

      const showFree = document.getElementById('showFree').checked;
      const showPayware = document.getElementById('showPayware').checked;

      for(let id in rawSceneryData) {
        const item = rawSceneryData[id];
        const paywareStatus = item.properties.payware || "free";

        // 토글 상태 체크
        if ((paywareStatus === "free" && showFree) || (paywareStatus === "payware" && showPayware)) {
          const layer = L.geoJSON(item, {
            style: function() {
              return { color: paywareStatus === "payware" ? "#ff4d4d" : "#3388ff" };
            },
            onEachFeature: function(feature, layer) {
              const tag = feature.properties.payware === "payware" ? "[유료]" : "[무료]";
              layer.bindPopup(`<b>${tag} ${feature.properties.title}</b>`);
            }
          });
          
          layer.eachLayer(function(l) {
            l.firebaseId = id;
            drawnItems.addLayer(l);
          });
        }
      }
    }
  </script>
</body>
</html>
