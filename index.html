<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>시너리 관리 시스템</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    header { background: #1e293b; color: white; padding: 10px; display: flex; gap: 8px; align-items: center; }
    #map { flex-grow: 1; z-index: 1; }
    .btn { cursor: pointer; padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-green { background: #10b981; color: white; }
    .btn-red { background: #ef4444; color: white; }
  </style>
</head>
<body>

<header>
  <button class="btn btn-blue" onclick="filterData('all')">전체</button>
  <button class="btn btn-green" onclick="filterData('free')">무료</button>
  <button class="btn btn-red" onclick="filterData('pay')">유료</button>
</header>

<div id="map"></div>

<script>
  let map, renderedElements = [], currentFilter = 'all';

  function init() {
    map = L.map('map').setView([36.5, 127.8], 7);
    L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { subdomains:['mt0','mt1','mt2','mt3'] }).addTo(map);
    render();
  }

  function render() {
    renderedElements.forEach(el => map.removeLayer(el));
    renderedElements = [];

    const data = window.sceneryData || [];

    data.forEach((s) => {
      if (currentFilter !== 'all' && s.type !== currentFilter) return;

      let modHtml = s.mods && s.mods.length > 0 
        ? s.mods.map(m => `<li><a href="${m.url}" target="_blank">${m.name}</a></li>`).join('') 
        : '없음';

      let urlHtml = s.url === "배포중이 아님" 
        ? "<b>배포중이 아닙니다</b>" 
        : `<a href="${s.url}" target="_blank">시너리 다운로드</a>`;

      let content = `<b>${s.name}</b><br>제작자: ${s.creator || '미상'}<br>${urlHtml}<hr><b>관련 모드:</b><ul>${modHtml}</ul>`;

      // 1. 단일 좌표 마커
      if (s.lat && s.lng) {
        const iconUrl = s.type === 'pay' ? 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png' : 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png';
        const m = L.marker([s.lat, s.lng], { icon: new L.Icon({ iconUrl, iconSize:[25,41], iconAnchor:[12,41] }) }).addTo(map);
        m.bindPopup(content);
        renderedElements.push(m);
      }

      // 2. 영역(사각형)
      if (s.bounds) {
        const rect = L.rectangle(s.bounds, { color: s.type === 'pay' ? '#ef4444' : '#3b82f6', weight: 2, fillOpacity: 0.2 }).addTo(map);
        rect.bindPopup(content);
        renderedElements.push(rect);
      }
    });
  }

  function filterData(f) { currentFilter = f; render(); }
  window.onload = init;
</script>

<!-- 데이터 수정은 아래 스크립트 블록에서 직접 하세요 -->
<script>
window.sceneryData = [
  /* 
     데이터 예시 (마커): 
     { "name": "인천공항", "type": "free", "lat": 37.4602, "lng": 126.4407, "url": "...", "mods": [] },
     
     데이터 예시 (영역):
     { "name": "제주도 커버리지", "type": "free", "bounds": [[33.1, 126.1], [33.6, 127.0]], "url": "배포중이 아님", "mods": [] }
  */
];
</script>
</body>
</html>
