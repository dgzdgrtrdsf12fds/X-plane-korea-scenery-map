<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리나라 시너리 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .admin-btn {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: #007bff; color: white; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .modal {
      display: none; position: fixed; z-index: 2000; left: 0; top: 0;
      width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 8px; width: 300px; text-align: center;
    }
    .modal-content input { width: 80%; padding: 8px; margin: 10px 0; }
    .modal-content button { padding: 8px 16px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <button class="admin-btn" id="adminToggleBtn" onclick="openLoginModal()">관리자 로그인</button>
  <div id="map"></div>

  <!-- 비밀번호 입력 모달 -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3>관리자 로그인</h3>
      <input type="password" id="adminPassword" placeholder="비밀번호 입력">
      <div>
        <button onclick="checkPassword()">확인</button>
        <button onclick="closeLoginModal()">취소</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // 1. Firebase 설정 (본인의 Firebase 키로 변경하세요)
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const sceneryRef = database.ref('sceneries');

    // 2. 지도 초기화 (대한민국 중심)
    const map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let isAdmin = false;
    let drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    let drawControl = new L.Control.Draw({
      draw: {
        polyline: false, polygon: false, circle: false, circlemarker: false,
        marker: true, rectangle: true
      },
      edit: { featureGroup: drawnItems, remove: true }
    });

    // 3. 관리자 로그인 처리
    function openLoginModal() {
      if(isAdmin) {
        isAdmin = false;
        map.removeControl(drawControl);
        document.getElementById('adminToggleBtn').innerText = '관리자 로그인';
        alert('로그아웃 되었습니다.');
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('adminPassword').value = '';
    }

    function checkPassword() {
      const input = document.getElementById('adminPassword').value;
      if(input === 'tlqkf123') {
        isAdmin = true;
        map.addControl(drawControl);
        document.getElementById('adminToggleBtn').innerText = '관리자 모드 (로그아웃)';
        closeLoginModal();
        alert('관리자로 로그인되었습니다. 마커 및 영역 그리기가 가능합니다.');
      } else {
        alert('비밀번호가 틀렸습니다.');
      }
    }

    // 4. DB 저장 및 삭제 이벤트 handling
    map.on(L.Draw.Event.CREATED, function (e) {
      if(!isAdmin) return;
      const layer = e.layer;
      const type = e.layerType;
      
      const title = prompt("시너리 이름/설명을 입력하세요:", "새 시너리");
      if(!title) return;

      let geoJsonData = layer.toGeoJSON();
      geoJsonData.properties = { title: title, type: type };

      const newRef = sceneryRef.push();
      newRef.set(geoJsonData);
    });

    map.on(L.Draw.Event.DELETED, function (e) {
      if(!isAdmin) return;
      e.layers.eachLayer(function (layer) {
        if(layer.firebaseId) {
          sceneryRef.child(layer.firebaseId).remove();
        }
      });
    });

    // 5. Firebase 실시간 데이터 동기화 (화면 표시)
    sceneryRef.on('value', function(snapshot) {
      drawnItems.clearLayers();
      const data = snapshot.val();
      for(let id in data) {
        const item = data[id];
        const layer = L.geoJSON(item, {
          onEachFeature: function(feature, layer) {
            layer.bindPopup(feature.properties.title || "시너리 정보");
          }
        });
        
        layer.eachLayer(function(l) {
          l.firebaseId = id;
          drawnItems.addLayer(l);
        });
      }
    });
  </script>
</body>
</html>
