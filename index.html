<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Plane Korea Scenery Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    .control-panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 10px 15px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: flex; gap: 12px; align-items: center;
    }
    .admin-btn {
      background: #007bff; color: white; border: none; padding: 6px 14px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .filter-group label { margin-right: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }

    .modal {
      display: none; position: fixed; z-index: 2000; left: 0; top: 0;
      width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 8px; width: 330px; text-align: left;
    }
    .modal-content h3 { margin-top: 0; text-align: center; }
    .modal-content label { font-size: 13px; font-weight: bold; display: block; margin-top: 8px; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    .grid-size-group {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .grid-size-group div { flex: 1; }
    .modal-btns { margin-top: 15px; text-align: center; }
    .modal-btns button { padding: 6px 14px; margin: 0 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="filter-group">
      <label><input type="checkbox" id="showFree" checked onchange="filterSceneries()"> 무료 보기</label>
      <label><input type="checkbox" id="showPayware" checked onchange="filterSceneries()"> 유료 보기</label>
    </div>
    <button class="admin-btn" id="adminToggleBtn" onclick="openLoginModal()">관리자 로그인</button>
  </div>

  <div id="map"></div>

  <!-- 관리자 로그인 모달 -->
  <div id="loginModal" class="modal">
    <div class="modal-content" style="text-align: center;">
      <h3>관리자 로그인</h3>
      <input type="password" id="adminPassword" placeholder="비밀번호 입력">
      <div class="modal-btns">
        <button onclick="checkPassword()">확인</button>
        <button onclick="closeLoginModal()">취소</button>
      </div>
    </div>
  </div>

  <!-- 시너리 정보 입력 및 1도 단위 범위 지정 모달 -->
  <div id="sceneryModal" class="modal">
    <div class="modal-content">
      <h3>시너리 정보 및 범위 설정</h3>
      <label>시너리 이름</label>
      <input type="text" id="sceneryTitle" placeholder="예: 한반도 남부 포토시너리">
      
      <!-- 1도 단위 범위 확장 설정 -->
      <label>격자 범위 지정 (1도 단위 커스텀)</label>
      <div class="grid-size-group">
        <div>
          <span style="font-size:11px;">위도 크기(도)</span>
          <input type="number" id="latSpan" value="1" min="1" max="10">
        </div>
        <div>
          <span style="font-size:11px;">경도 크기(도)</span>
          <input type="number" id="lngSpan" value="1" min="1" max="10">
        </div>
      </div>

      <label>유료 / 무료 구분</label>
      <select id="sceneryType">
        <option value="free">무료 (Free)</option>
        <option value="payware">유료 (Payware)</option>
      </select>

      <label>다운로드 / 판매 링크</label>
      <input type="url" id="sceneryLink" placeholder="https://...">

      <label>상세 설명</label>
      <textarea id="sceneryDesc" rows="3" placeholder="시너리 관련 설명 입력"></textarea>

      <div class="modal-btns">
        <button onclick="saveSceneryData()">저장</button>
        <button onclick="closeSceneryModal()">취소</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // 1. Firebase 설정 (본인 프로젝트 설정으로 교체)
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const sceneryRef = database.ref('sceneries');

    // 2. 지도 초기화 (Google Hybrid)
    const map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      attribution: '&copy; Google Maps'
    }).addTo(map);

    let isAdmin = false;
    let rawSceneryData = {};
    let baseClickLat = null;
    let baseClickLng = null;
    let pendingLayer = null;
    let drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    let drawControl = new L.Control.Draw({
      draw: {
        polyline: false, polygon: false, circle: false, circlemarker: false,
        marker: true, rectangle: true
      },
      edit: { featureGroup: drawnItems, remove: true }
    });

    // 3. 관리자 로그인
    function openLoginModal() {
      if(isAdmin) {
        isAdmin = false;
        map.removeControl(drawControl);
        document.getElementById('adminToggleBtn').innerText = '관리자 로그인';
        alert('로그아웃 되었습니다.');
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('adminPassword').value = '';
    }

    function checkPassword() {
      if(document.getElementById('adminPassword').value === 'tlqkf123') {
        isAdmin = true;
        map.addControl(drawControl);
        document.getElementById('adminToggleBtn').innerText = '관리자 (로그아웃)';
        closeLoginModal();
        alert('관리자 모드 활성화\n\n지도 클릭 시 1도 단위 범위(위도/경도 크기 지정)로 시너리를 추가할 수 있습니다.');
      } else {
        alert('비밀번호가 틀렸습니다.');
      }
    }

    // 4. 지도 클릭 시 선택한 위치 기반 1도 단위 범위 지정
    map.on('click', function(e) {
      if (!isAdmin) return;
      if (document.querySelector('.leaflet-draw-actions')) return;

      baseClickLat = Math.floor(e.latlng.lat);
      baseClickLng = Math.floor(e.latlng.lng);
      pendingLayer = null; // 클릭 기반 생성 처리

      document.getElementById('sceneryTitle').value = `포토시너리 (+${baseClickLat}+${baseClickLng})`;
      document.getElementById('latSpan').value = 1;
      document.getElementById('lngSpan').value = 1;
      document.getElementById('sceneryType').value = 'free';
      document.getElementById('sceneryLink').value = '';
      document.getElementById('sceneryDesc').value = '';
      
      document.getElementById('sceneryModal').style.display = 'flex';
    });

    // 도구함으로 직접 드래그해서 그릴 때
    map.on(L.Draw.Event.CREATED, function (e) {
      if(!isAdmin) return;
      pendingLayer = e.layer;
      baseClickLat = null;
      baseClickLng = null;

      document.getElementById('sceneryTitle').value = "새 시너리 구역";
      document.getElementById('latSpan').value = 1;
      document.getElementById('lngSpan').value = 1;
      document.getElementById('sceneryType').value = 'free';
      document.getElementById('sceneryLink').value = '';
      document.getElementById('sceneryDesc').value = '';
      
      document.getElementById('sceneryModal').style.display = 'flex';
    });

    function closeSceneryModal() {
      document.getElementById('sceneryModal').style.display = 'none';
      pendingLayer = null;
    }

    // DB 저장
    function saveSceneryData() {
      const title = document.getElementById('sceneryTitle').value || "이름 없음";
      const payware = document.getElementById('sceneryType').value;
      const link = document.getElementById('sceneryLink').value;
      const desc = document.getElementById('sceneryDesc').value;

      let targetLayer = pendingLayer;

      // 클릭 생성인 경우 설정된 1도 단위 위도/경도 크기 적용
      if (!targetLayer && baseClickLat !== null && baseClickLng !== null) {
        const latSpan = parseInt(document.getElementById('latSpan').value) || 1;
        const lngSpan = parseInt(document.getElementById('lngSpan').value) || 1;

        const bounds = [
          [baseClickLat, baseClickLng], 
          [baseClickLat + latSpan, baseClickLng + lngSpan]
        ];
        targetLayer = L.rectangle(bounds);
      }

      if (!targetLayer) return;

      let geoJsonData = targetLayer.toGeoJSON();
      geoJsonData.properties = {
        title: title,
        payware: payware,
        link: link,
        desc: desc
      };

      const newRef = sceneryRef.push();
      newRef.set(geoJsonData);

      closeSceneryModal();
    }

    // 삭제 이벤트
    map.on(L.Draw.Event.DELETED, function (e) {
      if(!isAdmin) return;
      e.layers.eachLayer(function (layer) {
        if(layer.firebaseId) {
          sceneryRef.child(layer.firebaseId).remove();
        }
      });
    });

    // 5. DB 실시간 수신 및 표시
    sceneryRef.on('value', function(snapshot) {
      rawSceneryData = snapshot.val() || {};
      filterSceneries();
    });

    function filterSceneries() {
      drawnItems.clearLayers();

      const showFree = document.getElementById('showFree').checked;
      const showPayware = document.getElementById('showPayware').checked;

      for(let id in rawSceneryData) {
        const item = rawSceneryData[id];
        const paywareStatus = item.properties.payware || "free";

        if ((paywareStatus === "free" && showFree) || (paywareStatus === "payware" && showPayware)) {
          const isPay = paywareStatus === "payware";
          
          const layer = L.geoJSON(item, {
            style: function() {
              return { 
                color: isPay ? "#ff3333" : "#0066ff", 
                weight: 2, 
                fillOpacity: 0.35 
              };
            },
            onEachFeature: function(feature, layer) {
              const props = feature.properties;
              const tag = props.payware === "payware" ? "<b style='color:red;'>[유료]</b>" : "<b style='color:blue;'>[무료]</b>";
              
              let popupContent = `<div style='font-size:13px;'>`;
              popupContent += `<h4>${tag} ${props.title}</h4>`;
              if(props.desc) popupContent += `<p style='margin:5px 0;'>${props.desc}</p>`;
              if(props.link) popupContent += `<a href='${props.link}' target='_blank' style='color:#007bff; font-weight:bold;'>[다운로드 / 링크]</a>`;
              popupContent += `</div>`;

              layer.bindPopup(popupContent);
            }
          });
          
          layer.eachLayer(function(l) {
            l.firebaseId = id;
            drawnItems.addLayer(l);
          });
        }
      }
    }
  </script>
</body>
</html>
